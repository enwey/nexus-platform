services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/backup:/backup
    ports:
      - "5432:5432"
    networks:
      - nexus-network

  nakama:
    image: heroiclabs/nakama:3.16.0
    container_name: nexus-nakama
    environment:
      NAKAMA_NAME: mygame
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY must be set}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?NAKAMA_HTTP_KEY must be set}
      NAKAMA_DATABASE_ADDRESS: postgres:5432
      NAKAMA_DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      NAKAMA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      NAKAMA_DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      NAKAMA_LOG_LEVEL: INFO
      NAKAMA_LOG_DB_QUERIES: false
    depends_on:
      - postgres
    ports:
      - "7350:7350"
      - "7351:7351"
    networks:
      - nexus-network

  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio:/data
      - ./minio/backup:/backup
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - nexus-network

  backend:
    build: ../backend
    container_name: nexus-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT must be set}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-nexus-games}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY must be set}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?NAKAMA_HTTP_KEY must be set}
      NAKAMA_SERVER_URL: ${NAKAMA_SERVER_URL:-http://nakama:7351}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET must be set}
      PLATFORM_ALLOW_INSECURE_DEFAULTS: "false"
      PLATFORM_BOOTSTRAP_ADMIN_ENABLED: ${PLATFORM_BOOTSTRAP_ADMIN_ENABLED:-false}
      PLATFORM_BOOTSTRAP_ADMIN_USERNAME: ${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:-}
      PLATFORM_BOOTSTRAP_ADMIN_EMAIL: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:-admin@nexus.local}
    depends_on:
      - postgres
      - redis
      - minio
      - nakama
    ports:
      - "8080:8080"
    networks:
      - nexus-network

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    networks:
      - nexus-network

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - nexus-network

  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: 'true'
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres:
    driver: local
  minio:
    driver: local
  prometheus:
    driver: local
  grafana:
    driver: local

spring:
  application:
    name: nexus-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:nexus-games}

nakama:
  server-key: ${NAKAMA_SERVER_KEY}
  http-key: ${NAKAMA_HTTP_KEY}
  server-url: ${NAKAMA_SERVER_URL:http://localhost:7351}

server:
  port: 8080
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    ttl-hours: ${SECURITY_JWT_TTL_HOURS:2}
    refresh-ttl-days: ${SECURITY_JWT_REFRESH_TTL_DAYS:14}

platform:
  public-base-url: ${PLATFORM_API_BASE_URL:${PLATFORM_PUBLIC_BASE_URL:http://47.99.34.148:81/api/v1}}
  cdn-base-url: ${PLATFORM_CDN_BASE_URL:}
  legal:
    terms-title: ${PLATFORM_LEGAL_TERMS_TITLE:Nexus User Agreement}
    terms-html: ${PLATFORM_LEGAL_TERMS_HTML:<p>Welcome to Nexus Platform.</p><p>This is the default user agreement content.</p>}
    privacy-title: ${PLATFORM_LEGAL_PRIVACY_TITLE:Nexus Privacy Policy}
    privacy-html: ${PLATFORM_LEGAL_PRIVACY_HTML:<p>Welcome to Nexus Platform.</p><p>This is the default privacy policy content.</p>}
  share:
    app-scheme-template: ${PLATFORM_SHARE_APP_SCHEME_TEMPLATE:bringbox://game/%s}
    android-install-url: ${PLATFORM_SHARE_ANDROID_INSTALL_URL:https://play.google.com/store/apps/details?id=com.nexus.platform}
    ios-install-url: ${PLATFORM_SHARE_IOS_INSTALL_URL:https://apps.apple.com}
    other-install-url: ${PLATFORM_SHARE_OTHER_INSTALL_URL:https://bringbox.com/download}
  game-package:
    master-key: ${PLATFORM_GAME_PACKAGE_MASTER_KEY:nexus-platform-dev-master-key}
    runtime-ticket-ttl-seconds: ${PLATFORM_GAME_PACKAGE_RUNTIME_TICKET_TTL_SECONDS:120}
    runtime-ticket-signing-key: ${PLATFORM_GAME_PACKAGE_RUNTIME_TICKET_SIGNING_KEY:nexus-platform-dev-runtime-ticket-signing-key}
  security:
    allow-insecure-defaults: ${PLATFORM_ALLOW_INSECURE_DEFAULTS:false}
  bootstrap-admin:
    enabled: ${PLATFORM_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:admin@nexus.local}
  email:
    enabled: ${PLATFORM_EMAIL_ENABLED:false}
    from-address: ${PLATFORM_EMAIL_FROM:${SPRING_MAIL_USERNAME:noreply@nexus.local}}
    from-name: ${PLATFORM_EMAIL_FROM_NAME:Nexus Platform}

logging:
  level:
    com.nexus.platform: DEBUG
    org.springframework.web: INFO

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: nexus-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:nexus-games}

nakama:
  server-key: ${NAKAMA_SERVER_KEY}
  http-key: ${NAKAMA_HTTP_KEY}
  server-url: ${NAKAMA_SERVER_URL:http://localhost:7351}

server:
  port: 8080
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    ttl-hours: ${SECURITY_JWT_TTL_HOURS:2}
    refresh-ttl-days: ${SECURITY_JWT_REFRESH_TTL_DAYS:14}

platform:
  public-base-url: ${PLATFORM_PUBLIC_BASE_URL:http://localhost:8080/api/v1}
  cdn-base-url: ${PLATFORM_CDN_BASE_URL:}
  security:
    allow-insecure-defaults: ${PLATFORM_ALLOW_INSECURE_DEFAULTS:false}
  bootstrap-admin:
    enabled: ${PLATFORM_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:admin@nexus.local}

logging:
  level:
    com.nexus.platform: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
